# Conservative kernel baseline for a Linux edge/origin node.
# Review each setting against the workload and cloud provider before applying.
# Apply with: sudo sysctl --system (or sysctl -p this-file).

# This host is intentionally a router between an edge listener and an origin.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# Do not accept source-routed or ICMP redirect traffic.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Basic TCP resilience. These are not a substitute for a firewall or quotas.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_keepalive_time = 1200
net.ipv4.tcp_fastopen = 3

# Use BBR only when the installed kernel exposes it; verify with:
# sysctl net.ipv4.tcp_available_congestion_control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Bounded buffers suitable as a starting point; measure before changing.
net.ipv4.tcp_rmem = 4096 87380 25000000
net.ipv4.tcp_wmem = 4096 16384 25000000
net.core.rmem_max = 25000000
net.core.wmem_max = 25000000
